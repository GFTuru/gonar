<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Chat Support</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #111827; color: #f3f4f6; }
        /* Scrollbar kustom */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="h-screen flex flex-col bg-gray-900 overflow-hidden">

    <!-- Modal Login (Disamarkan sebagai Pendaftaran Live Chat) -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-90 z-50 flex justify-center items-center">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-11/12 max-w-md border border-gray-700 transform transition-all">
            <div class="text-center mb-6">
                <div class="inline-block bg-blue-500/20 p-3 rounded-full mb-3">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-white">Gabung Live Chat</h2>
                <p class="text-gray-400 text-sm mt-2">Silakan masukkan nama Anda untuk mulai terhubung dengan tim support kami.</p>
            </div>
            
            <div id="loginErrorMsg" class="hidden bg-red-500/20 border border-red-500 text-red-300 text-sm p-3 rounded mb-4 text-center">
                Nama tidak boleh kosong!
            </div>

            <input type="text" id="inputNamaLogin" placeholder="Ketik nama Anda di sini..." class="w-full p-3 rounded-lg bg-gray-900 text-white border border-gray-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mb-4 transition-all">
            <button onclick="prosesLogin()" id="btnMulaiChat" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg shadow-blue-500/30">
                Mulai Obrolan
            </button>
        </div>
    </div>

    <header class="bg-gray-800 border-b border-gray-700 p-4 shadow-md flex justify-between items-center z-10">
        <h1 class="text-xl font-bold text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-green-500 animate-pulse"></span>
            Customer Support
        </h1>
        <div class="flex gap-4">
            <button onclick="switchTab('chat')" id="tab-chat" class="pb-1 font-semibold tab-active transition-colors">Live Chat</button>
            <button onclick="switchTab('admin')" id="tab-admin" class="pb-1 font-semibold text-gray-400 hover:text-gray-200 transition-colors">Panel Admin</button>
        </div>
    </header>

    <!-- AREA CHAT -->
    <main id="area-chat" class="flex-1 flex flex-col relative">
        <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-4 pb-20">
            <div class="text-center text-gray-500 text-sm my-4">Memuat obrolan...</div>
            <!-- Pesan chat akan muncul di sini -->
        </div>

        <div class="absolute bottom-0 w-full bg-gray-800 border-t border-gray-700 p-3 shadow-lg flex gap-2">
            <input type="text" id="inputPesan" placeholder="Ketik pesan..." class="flex-1 p-3 rounded-full bg-gray-900 text-white border border-gray-600 focus:outline-none focus:border-blue-500" onkeypress="if(event.key === 'Enter') kirimPesan()">
            <button onclick="kirimPesan()" id="btnKirimPesan" class="bg-blue-600 hover:bg-blue-500 text-white rounded-full p-3 w-12 h-12 flex items-center justify-center transition-colors">
                <svg class="w-5 h-5 ml-1" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"></path></svg>
            </button>
        </div>
    </main>

    <!-- AREA ADMIN -->
    <main id="area-admin" class="flex-1 hidden flex flex-col p-4 overflow-hidden bg-gray-900">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-white">Sistem Tracking Radar</h2>
            <button onclick="refreshDataAdmin()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 shadow-lg shadow-indigo-500/20 transition-all">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refresh Data
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-1 min-h-0">
            
            <!-- Log Masuk (History Login) -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 flex flex-col overflow-hidden shadow-md">
                <div class="bg-gray-700/50 p-3 border-b border-gray-600">
                    <h3 class="font-bold text-green-400 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
                        Log Kehadiran (Login)
                    </h3>
                </div>
                <div id="listHistory" class="flex-1 overflow-y-auto p-3 space-y-2">
                    <p class="text-gray-500 text-center text-sm mt-4">Klik refresh untuk memuat data...</p>
                </div>
            </div>

            <!-- Log Aktivitas (Klik Layar) -->
            <div class="bg-gray-800 rounded-xl border border-gray-700 flex flex-col overflow-hidden shadow-md">
                <div class="bg-gray-700/50 p-3 border-b border-gray-600">
                    <h3 class="font-bold text-rose-400 flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        Log Aktivitas (Live Clicks)
                    </h3>
                </div>
                <div id="listAktivitas" class="flex-1 overflow-y-auto p-3 space-y-2">
                    <p class="text-gray-500 text-center text-sm mt-4">Klik refresh untuk memuat data...</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        // URL Database Firebase
        const DB_BASE_URL = "https://gf9-dn5-default-rtdb.asia-southeast1.firebasedatabase.app";
        const URL_CHAT = `${DB_BASE_URL}/chat.json`;
        const URL_HISTORY = `${DB_BASE_URL}/history.json`;
        const URL_ACTIVITY = `${DB_BASE_URL}/activities.json`;

        // Fungsi mendapatkan info detail device target
        function dapatkanInfoDevice() {
            const ua = navigator.userAgent;
            if (/iPhone/i.test(ua)) return "iPhone (iOS)";
            if (/iPad/i.test(ua)) return "iPad (iOS)";
            if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? "Android (HP)" : "Android (Tablet)";
            if (/Windows NT/i.test(ua)) return "Windows (PC/Laptop)";
            if (/Macintosh/i.test(ua)) return "MacBook/iMac (macOS)";
            if (/Linux/i.test(ua)) return "Linux";
            return "Perangkat Tidak Dikenali";
        }

        // Fungsi mendapatkan waktu rapi
        function waktuSekarang() {
            return new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }

        // Cek sesi login saat halaman dimuat
        window.onload = function() {
            const nama = localStorage.getItem("namaUser");
            if (nama) {
                document.getElementById("loginModal").style.display = "none";
                loadChat(); // Langsung load chat jika sudah login
            }
        };

        function prosesLogin() {
            const nama = document.getElementById("inputNamaLogin").value.trim();
            const errorMsg = document.getElementById("loginErrorMsg");
            
            if (nama === "") {
                errorMsg.classList.remove("hidden");
                return;
            }
            errorMsg.classList.add("hidden");

            // Mengubah tombol menjadi loading
            const btn = document.getElementById("btnMulaiChat");
            btn.innerHTML = "Memproses...";
            btn.disabled = true;

            const dataHistory = {
                nama: nama,
                device: dapatkanInfoDevice(),
                waktu: waktuSekarang()
            };

            // Kirim rekam jejak history ke Firebase
            fetch(URL_HISTORY, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataHistory)
            }).then(() => {
                localStorage.setItem("namaUser", nama);
                document.getElementById("loginModal").style.display = "none";
                
                // Track aksi pertama kali
                catatAktivitas(nama, "Berhasil masuk ke Live Chat");
                loadChat();
            }).catch(err => {
                alert("Gagal koneksi ke server.");
                btn.innerHTML = "Mulai Obrolan";
                btn.disabled = false;
            });
        }

        // EVENT LISTENER GLOBAL - Mendengarkan setiap klik secara diam-diam
        document.addEventListener('click', function(e) {
            const nama = localStorage.getItem("namaUser");
            if (!nama) return; // Jangan rekam jika belum login

            let element = e.target;
            let aksi = "";

            // Deteksi jika yang diklik adalah tombol
            const isButton = element.closest('button');
            const isInput = element.closest('input');
            const isTab = element.id && element.id.startsWith('tab-');

            if (isButton) {
                // Ambil teks tombol atau ID-nya
                let btnText = isButton.innerText.trim() || isButton.id || "Tombol Icon";
                aksi = `Mengklik tombol "${btnText}"`;
            } 
            else if (isInput) {
                aksi = `Mengklik kolom ketik "${isInput.placeholder || isInput.id}"`;
            } 
            else if (isTab) {
                aksi = `Berpindah ke tab "${element.innerText}"`;
            }

            // Jika ada aksi terdeteksi, kirim ke database diam-diam
            if (aksi !== "") {
                catatAktivitas(nama, aksi);
            }
        });

        // Fungsi eksekusi kirim tracker ke Firebase
        function catatAktivitas(nama, teksAksi) {
            const dataActivity = {
                nama: nama,
                aksi: teksAksi,
                device: dapatkanInfoDevice(),
                waktu: waktuSekarang()
            };
            
            // Diam-diam tanpa error alert
            fetch(URL_ACTIVITY, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataActivity)
            }).catch(e => console.log("Tracker tertunda"));
        }

        function switchTab(tab) {
            if(tab === 'chat') {
                document.getElementById('area-chat').classList.remove('hidden');
                document.getElementById('area-admin').classList.add('hidden');
                document.getElementById('tab-chat').classList.add('tab-active', 'text-blue-500');
                document.getElementById('tab-chat').classList.remove('text-gray-400');
                document.getElementById('tab-admin').classList.remove('tab-active', 'text-blue-500');
                document.getElementById('tab-admin').classList.add('text-gray-400');
            } else {
                document.getElementById('area-admin').classList.remove('hidden');
                document.getElementById('area-chat').classList.add('hidden');
                document.getElementById('tab-admin').classList.add('tab-active', 'text-blue-500');
                document.getElementById('tab-admin').classList.remove('text-gray-400');
                document.getElementById('tab-chat').classList.remove('tab-active', 'text-blue-500');
                document.getElementById('tab-chat').classList.add('text-gray-400');
                
                // Otomatis refresh data saat buka admin
                refreshDataAdmin(); 
            }
        }

        // --- FITUR CHAT ---
        function kirimPesan() {
            const input = document.getElementById("inputPesan");
            const pesan = input.value.trim();
            const nama = localStorage.getItem("namaUser") || "Anonim";

            if (pesan === "") return;

            input.value = ""; // Kosongkan input
            
            const dataChat = { nama: nama, pesan: pesan, waktu: waktuSekarang() };

            fetch(URL_CHAT, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(dataChat)
            }).then(() => {
                loadChat();
                // Tracker mencatat pesan terkirim
                catatAktivitas(nama, `Mengirim pesan: "${pesan}"`);
            });
        }

        function loadChat() {
            const chatBox = document.getElementById("chatBox");
            const myName = localStorage.getItem("namaUser");

            fetch(URL_CHAT)
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML = ""; // Bersihkan chat sebelumnya
                if (!data) {
                    chatBox.innerHTML = "<div class='text-center text-gray-500 text-sm my-4'>Belum ada pesan. Mulai obrolan!</div>";
                    return;
                }

                Object.values(data).forEach(item => {
                    const isMe = item.nama === myName;
                    
                    const divPesan = document.createElement("div");
                    divPesan.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    
                    divPesan.innerHTML = `
                        <span class="text-xs text-gray-400 mb-1 px-1">${item.nama} • ${item.waktu.split(',')[1]}</span>
                        <div class="px-4 py-2 rounded-2xl max-w-[80%] ${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-gray-700 text-gray-100 rounded-bl-none'}">
                            ${item.pesan}
                        </div>
                    `;
                    chatBox.appendChild(divPesan);
                });

                // Auto scroll ke paling bawah
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        // Auto reload chat setiap 3 detik
        setInterval(() => {
            if(!document.getElementById('area-chat').classList.contains('hidden')){
                loadChat();
            }
        }, 3000);

        function refreshDataAdmin() {
            loadHistoryPanel();
            loadAktivitasPanel();
        }

        function loadHistoryPanel() {
            const container = document.getElementById("listHistory");
            container.innerHTML = "<p class='text-gray-400 text-sm text-center'>Memuat data...</p>";

            fetch(URL_HISTORY)
            .then(res => res.json())
            .then(data => {
                container.innerHTML = ""; 
                if (!data) return container.innerHTML = "<p class='text-gray-500 text-sm text-center'>Belum ada data kehadiran.</p>";

                Object.values(data).reverse().forEach(item => { // Reverse agar yang baru di atas
                    const div = document.createElement("div");
                    div.className = "bg-gray-900 p-2 rounded border border-gray-700 text-sm";
                    div.innerHTML = `
                        <div class="font-bold text-green-400">${item.nama}</div>
                        <div class="text-gray-300 text-xs mt-1">🖥️ ${item.device}</div>
                        <div class="text-gray-500 text-xs mt-1">🕒 ${item.waktu}</div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function loadAktivitasPanel() {
            const container = document.getElementById("listAktivitas");
            container.innerHTML = "<p class='text-gray-400 text-sm text-center'>Memuat data...</p>";

            fetch(URL_ACTIVITY)
            .then(res => res.json())
            .then(data => {
                container.innerHTML = ""; 
                if (!data) return container.innerHTML = "<p class='text-gray-500 text-sm text-center'>Belum ada data aktivitas radar.</p>";

                Object.values(data).reverse().forEach(item => { // Reverse agar yang baru di atas
                    const div = document.createElement("div");
                    div.className = "bg-gray-900 p-2 rounded border border-gray-700 text-sm border-l-2 border-l-rose-500";
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <span class="font-bold text-blue-300">${item.nama}</span>
                            <span class="text-gray-500 text-[10px]">${item.waktu.split(',')[1]}</span>
                        </div>
                        <div class="text-gray-200 mt-1">${item.aksi}</div>
                    `;
                    container.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
